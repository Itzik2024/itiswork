<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>It works!</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
    <style>
        html,body{
        height: 90%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(255, 202, 173);
}

.box{
    display: flex;
}

.box .inner {
    width: 400px;
    height: 200px;
    line-height: 200px;
    font-size: 4em;
    font-family: sans-serif;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
}

.box .inner:first-child {
    background-color: indianred;
    color: rgb(60, 2, 2);
    box-shadow: black 2px 15px 20px;
    transform-origin: right;
    transform: perspective(100px) rotateY(-15deg);
}

.box .inner:last-child {
    background-color: lightcoral;
    color: rgb(245, 216, 179);
    box-shadow: black 2px 15px 20px;
    transform-origin: left;
    transform: perspective(100px) rotateY(15deg);
}

.box .inner span{
    position: absolute;
    animation: marquee 5s linear infinite;
}

.box .inner:first-child span{
    animation-delay: 2.5s;
    left: -100%;
}

@keyframes marquee {
    from {
        left: 100%;
    }

    to {
        left: -100%;
    }
}   
</style>


</head>
<body>
<div  align="center" style="width:90%">
<h1 style="margin-top: 200px;margin-bottom: 5px;">BoberK</h1>
	
	<video id="Bober" style="width:180px" muted="true">
	<source src="./Bober_Tekkno1.mp4" type="video/mp4">
	</video>
	
	<video id="555" style="width:250px" muted="true">
	<source src="./555.mp4" type="video/mp4">
	</video>
	
	<video id="vjuh" style="width:300px" muted="true" >
	<source src="./vjuh.mp4" type="video/mp4">
	</video>

	
<h1>It works!</h1>	
</div>
   <div class="box">
        <div class="inner">
            <span>Hello World</span>
        </div>
        <div class="inner">
            <span>Hello World</span>
        </div>
</div>
	
<script>
$( document ).ready(function(){
	console.log("Hello World!");
       $('#vjuh').get(0).play();
	$('#555').get(0).play();
	$('#Bober').get(0).play();
	
	$("#vjuh").prop('loop', true);
	$("#555").prop('loop', true);
	$("#Bober").prop('loop', true);
	
	$("#vjuh").prop('controls', true);
	$("#555").prop('controls', true);
	$("#Bober").prop('controls', true);
	console.log("Bober Kurwa");
//	$("#Bober_Tekkno").prop('muted', false);
});
</script>
</div>






</body>
